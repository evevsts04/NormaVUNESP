    // =========================================================================
    // 4. SERVIÇO GEMINI API (BACKOFF + 2 CAMADAS + CONTESTAÇÃO + REESCRITA)
    // =========================================================================

    const GEMINI_MODEL = 'gemini-3-flash-preview';
    const GEMINI_API_KEY = ''; // Fornecido automaticamente pelo ambiente em tempo de execução

    async function callGeminiAPI(payload, maxRetries = 4) {
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
      let delay = 1000;

      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            if ((response.status === 429 || response.status >= 500) && attempt < maxRetries) {
              await new Promise(r => setTimeout(r, delay));
              delay *= 2;
              continue;
            }
            const errText = await response.text().catch(() => '');
            throw new Error(`HTTP ${response.status}: ${errText || 'Falha na comunicação com a API.'}`);
          }

          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!text) {
            throw new Error('A resposta da IA não continha texto válido.');
          }
          return text;
        } catch (err) {
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          throw err;
        }
      }
    }

    /**
     * Extrai e faz parse seguro de JSON mesmo quando envolvido em blocos markdown ```json ... ```
     */
    function cleanAndParseJSON(rawText) {
      let cleaned = (rawText || '').trim();
      // Remove cercas de código markdown se existirem
      cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

      try {
        return JSON.parse(cleaned);
      } catch (e) {
        // Tentativa de extrair o primeiro objeto JSON balanceado
        const firstBrace = cleaned.indexOf('{');
        const lastBrace = cleaned.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
          const slice = cleaned.slice(firstBrace, lastBrace + 1);
          return JSON.parse(slice);
        }
        throw new Error('Não foi possível interpretar o JSON retornado pela IA.');
      }
    }

Gere entre 8 e 10 annotations, exatamente 6 questions e exatamente 2 rewrites.`;

      const raw = await callGeminiAPI({

    /**

    async function auditStudyUnitLayer2(rawText, layer1Data) {

    // =========================================================================
    // 5. LÓGICA DE DIAGNÓSTICO, ESTATÍSTICAS E PONTOS FRACOS
    // =========================================================================

    function recordAnswerInStats(textObj, question, isCorrect) {
      const pillar = PILLARS.includes(question.pillar) ? question.pillar : 'Morfologia';
      if (!STATE.stats.byPillar[pillar]) {
        STATE.stats.byPillar[pillar] = { answered: 0, correct: 0 };
      }
      STATE.stats.byPillar[pillar].answered += 1;
      if (isCorrect) {
        STATE.stats.byPillar[pillar].correct += 1;
      } else {
        // Adiciona à fila de revisão espaçada (evitando duplicar a mesma questão)
        STATE.stats.recentErrors = STATE.stats.recentErrors.filter(e => e.questionId !== question.id);
        STATE.stats.recentErrors.unshift({
          id: `err-${Date.now()}`,
          textId: textObj.id,
          textTitle: textObj.title,
          questionId: question.id,
          pillar,
          stem: question.stem,
          explanation: question.explanation,
          date: new Date().toLocaleDateString('pt-BR')
        });
        // Mantém os 15 erros mais recentes
        if (STATE.stats.recentErrors.length > 15) {
          STATE.stats.recentErrors.pop();
        }
      }
      saveJSON(STORAGE_KEYS.STATS, STATE.stats);
    }

    function getWeakestPillars(count = 2) {
      const entries = PILLARS.map(p => {
        const d = STATE.stats.byPillar[p] || { answered: 0, correct: 0 };
        const rate = d.answered > 0 ? (d.correct / d.answered) : 1.01; // pilares não respondidos ficam por último
        return { pillar: p, answered: d.answered, rate };
      });
      const answeredOnes = entries.filter(e => e.answered > 0);
      if (answeredOnes.length === 0) {
        return ['Regência', 'Crase']; // Padrão inicial mais cobrado pela VUNESP
      }
      answeredOnes.sort((a, b) => a.rate - b.rate);
      const selected = answeredOnes.slice(0, count).map(e => e.pillar);
      if (selected.length < count) {
        for (const p of PILLARS) {
          if (!selected.includes(p)) {
            selected.push(p);
            if (selected.length === count) break;
          }
        }
      }
      return selected;
    }

    // =========================================================================
    // 6. UTILITÁRIOS DE UI (MODAL CUSTOMIZADO, TOAST, ESCAPE HTML)
    // =========================================================================

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-rose-900 text-white border-rose-700',
        info: 'bg-ink text-white border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function openModal({ title, message, icon = 'ℹ️', confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', onConfirm = null, danger = false }) {
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('modal-icon').textContent = icon;

      const actions = document.getElementById('modal-actions');
      actions.innerHTML = '';

      if (onConfirm) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition';
        cancelBtn.textContent = cancelLabel;
        cancelBtn.onclick = closeModal;
        actions.appendChild(cancelBtn);

        const confirmBtn = document.createElement('button');
        confirmBtn.className = `px-4 py-2 rounded-lg text-sm font-semibold text-white transition ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-ink hover:bg-slate-800'}`;
        confirmBtn.textContent = confirmLabel;
        confirmBtn.onclick = () => {
          closeModal();
          onConfirm();
        };
        actions.appendChild(confirmBtn);
      } else {
        const okBtn = document.createElement('button');
        okBtn.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-ink text-white hover:bg-slate-800 transition';
        okBtn.textContent = 'Entendi';
        okBtn.onclick = closeModal;
        actions.appendChild(okBtn);
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('custom-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function selectCategory(catId) {
      STATE.selectedCategory = catId;

    }

    function handleAnnotationClick(annId) {
      if (!STATE.currentText) return;
      const ann = STATE.currentText.annotations.find(a => a.id === annId);
      if (!ann) return;

      const selectedCat = ANNOTATION_CATEGORIES.find(c => c.id === STATE.selectedCategory);
      const correctCat = ANNOTATION_CATEGORIES.find(c => c.id === ann.category);

      if (STATE.foundAnnotations[annId]) {
        STATE.lastReadingFeedback = {
          type: 'info',
          title: `${correctCat ? correctCat.label : ann.category} — "${ann.text}"`,
          message: ann.explanation
        };
        renderApp();
        return;
      }

      if (ann.category === STATE.selectedCategory) {
        STATE.foundAnnotations[annId] = true;
        STATE.lastReadingFeedback = {
          type: 'success',
          title: `Correto! ${correctCat.label} — "${ann.text}"`,
          message: ann.explanation
        };
      } else {
        STATE.lastReadingFeedback = {
          type: 'error',
          title: `Ainda não! "${ann.text}" não é ${selectedCat.label}.`,
          message: `Dica: Observe a função desse termo na frase. ${correctCat ? 'Pense se ele não atua como ' + correctCat.hint.toLowerCase() : ''}`
        };
      }
      renderApp();
    }

    function revealAllAnnotations() {
      if (!STATE.currentText) return;
      STATE.currentText.annotations.forEach(a => {
        STATE.foundAnnotations[a.id] = true;
      });
      STATE.lastReadingFeedback = {
        type: 'info',
        title: 'Análise completa revelada',
        message: 'Clique em qualquer trecho colorido no texto para consultar sua explicação morfossintática.'
      };
      renderApp();
    }

    function resetAnnotations() {
      STATE.foundAnnotations = {};
      STATE.lastReadingFeedback = null;
      renderApp();
    }

    function answerQuestion(questionId, optionIndex) {
      if (!STATE.currentText) return;
      if (STATE.questionAnswers[questionId] !== undefined) return; // Evita dupla contagem

      const q = STATE.currentText.questions.find(item => item.id === questionId);
      if (!q) return;

      STATE.questionAnswers[questionId] = optionIndex;
      const isCorrect = optionIndex === q.correctIndex;
      recordAnswerInStats(STATE.currentText, q, isCorrect);

      showToast(
        isCorrect ? `Acerto em ${q.pillar}! Estatística atualizada.` : `Erro em ${q.pillar}. Adicionado à revisão espaçada.`,
        isCorrect ? 'success' : 'error'
      );
      renderApp();
    }

    async function handleContestQuestion(questionId) {
      if (!STATE.currentText) return;
      const q = STATE.currentText.questions.find(item => item.id === questionId);
      if (!q) return;

      STATE.contestationResults[questionId] = { loading: true, text: null, error: null };
      renderApp();

      try {
        const parecer = await contestQuestionWithAI(STATE.currentText, q);
        STATE.contestationResults[questionId] = { loading: false, text: parecer, error: null };
        STATE.barrierMetrics.contestationsRun += 1;
        saveJSON(STORAGE_KEYS.BARRIER_METRICS, STATE.barrierMetrics);
      } catch (err) {
        STATE.contestationResults[questionId] = {
          loading: false,
          text: null,
          error: 'Não foi possível contatar o auditor de IA neste momento. Consulte o gabarito comentado acima.'
        };
      }
      renderApp();
    }

    function updateRewriteInput(rewriteId, value) {
      STATE.rewriteInputs[rewriteId] = value;
    }

    async function handleEvaluateRewrite(rewriteId) {
      if (!STATE.currentText) return;
      const rw = STATE.currentText.rewrites.find(r => r.id === rewriteId);
      if (!rw) return;

      const userAnswer = (STATE.rewriteInputs[rewriteId] || '').trim();
      if (userAnswer.length < 8) {
        showToast('Digite sua reescrita completa antes de avaliar.', 'error');
        return;
      }

      STATE.rewriteResults[rewriteId] = { loading: true, data: null, isFallback: false };
      renderApp();

      try {
        const evalData = await evaluateRewriteWithAI(rw, userAnswer);
        STATE.rewriteResults[rewriteId] = { loading: false, data: evalData, isFallback: false };
      } catch (err) {
        // Fallback inteligente caso a API esteja indisponível
        const normalizedUser = userAnswer.toLowerCase().replace(/[.,;!?]/g, '').replace(/\s+/g, ' ');
        const normalizedModel = rw.modelAnswer.toLowerCase().replace(/[.,;!?]/g, '').replace(/\s+/g, ' ');
        const exactMatch = normalizedUser === normalizedModel;

        STATE.rewriteResults[rewriteId] = {
          loading: false,
          isFallback: true,
          data: {
            overallStatus: exactMatch ? 'Correta (Validação Local)' : 'Compare com o Gabarito Modelo',
            score: exactMatch ? 100 : null,
            summary: exactMatch
              ? 'Sua reescrita coincide perfeitamente com o gabarito modelo de referência!'
              : 'A avaliação por IA não respondeu no momento. Compare sua frase ponto a ponto com o gabarito modelo e os critérios abaixo.',
            criteria: [
              { name: 'Concordância & Regência', status: exactMatch ? 'ok' : 'atencao', comment: rw.rubric },
              { name: 'Crase & Pontuação', status: exactMatch ? 'ok' : 'atencao', comment: 'Verifique atentamente os acentos graves e as vírgulas no gabarito modelo.' }
            ],
            suggestedRewrite: rw.modelAnswer
          }
        };
      }
      renderApp();
    }

    async function handleGenerateAIStudy() {
      const rawText = (STATE.studioInputText || '').trim();
      if (rawText.length < 120) {
        showToast('Cole um texto com pelo menos 120 caracteres (ideal: 2 a 4 parágrafos).', 'error');
        return;
      }

      const weakPillars = getWeakestPillars(2);
      STATE.studioPipeline = { running: true, step: 1, error: null };
      renderApp();

      try {
        // CAMADA 1: Geração Estrita com Few-Shot VUNESP
        const layer1 = await generateStudyUnitLayer1(rawText, STATE.studioFocusMode, weakPillars);

        // CAMADA 2: Auditoria Normativa Automatizada
        STATE.studioPipeline.step = 2;
        renderApp();

        let finalUnit;
        try {
          finalUnit = await auditStudyUnitLayer2(rawText, layer1);
        } catch (auditErr) {
          // Se a camada 2 falhar por timeout, preserva a camada 1 sinalizando ressalva
          finalUnit = {
            ...layer1,
            auditReport: {
              passed: false,
              correctionsCount: 0,
              notes: ['A 2ª camada de auditoria excedeu o tempo limite. Use o botão "Contestar Gabarito" em caso de dúvida.']
            }
          };
        }

        STATE.studioPipeline.step = 3;
        renderApp();

        // Normalização de IDs e verificação de integridade dos trechos de anotação
        const unitId = `ai-${Date.now()}`;
        const validAnnotations = (finalUnit.annotations || [])
          .filter(a => {
            const p = finalUnit.paragraphs[a.paragraphIndex];
            return p && a.text && p.includes(a.text) && ANNOTATION_CATEGORIES.some(c => c.id === a.category);
          })
          .map((a, idx) => ({ ...a, id: `${unitId}-a${idx + 1}` }));

        const validQuestions = (finalUnit.questions || []).map((q, idx) => ({
          ...q,
          id: `${unitId}-q${idx + 1}`,
          pillar: PILLARS.includes(q.pillar) ? q.pillar : PILLARS[idx % PILLARS.length],
          options: Array.isArray(q.options) && q.options.length === 5 ? q.options : ['A', 'B', 'C', 'D', 'E'],
          correctIndex: typeof q.correctIndex === 'number' && q.correctIndex >= 0 && q.correctIndex <= 4 ? q.correctIndex : 0
        }));

        const validRewrites = (finalUnit.rewrites || []).map((r, idx) => ({
          ...r,
          id: `${unitId}-r${idx + 1}`
        }));

        const normalizedUnit = {
          id: unitId,
          title: finalUnit.title || 'Estudo Personalizado VUNESP',
          genre: finalUnit.genre || 'Texto Autêntico',
          difficulty: finalUnit.difficulty || 'Personalizado',
          sourceType: 'ai',
          focusMode: STATE.studioFocusMode,
          focusedPillars: STATE.studioFocusMode === 'pontos_fracos' ? weakPillars : PILLARS,
          createdAt: new Date().toLocaleString('pt-BR'),
          summary: finalUnit.summary || 'Unidade gerada e auditada pelo pipeline de 2 camadas.',
          paragraphs: finalUnit.paragraphs,
          annotations: validAnnotations,
          questions: validQuestions,
          rewrites: validRewrites,
          auditReport: finalUnit.auditReport || {
            passed: true,
            correctionsCount: 0,
            notes: ['Auditoria normativa concluída sem inconsistências críticas.']
          }
        };

        STATE.aiHistory.unshift(normalizedUnit);
        saveJSON(STORAGE_KEYS.AI_HISTORY, STATE.aiHistory);

        STATE.barrierMetrics.textsAudited += 1;
        STATE.barrierMetrics.correctionsByAuditor += (normalizedUnit.auditReport.correctionsCount || 0);
        saveJSON(STORAGE_KEYS.BARRIER_METRICS, STATE.barrierMetrics);

        STATE.studioPipeline = { running: false, step: 0, error: null };
        showToast('Unidade gerada e auditada pela Camada Normativa!', 'success');
        openTextForStudy(unitId, 'leitura');
      } catch (err) {
        STATE.studioPipeline = {
          running: false,
          step: 0,
          error: 'Não foi possível gerar a unidade com a IA agora. Verifique sua conexão ou tente novamente em instantes.'
        };
        renderApp();
      }
    }

    // =========================================================================

    function buildInteractiveParagraphHTML(paragraphText, annotationsInParagraph) {
      if (!annotationsInParagraph || annotationsInParagraph.length === 0) {
        return escapeHTML(paragraphText);
      }

      // Localiza intervalos [start, end] sem sobreposição
      const ranges = [];
      annotationsInParagraph.forEach(ann => {
        const idx = paragraphText.indexOf(ann.text);
        if (idx !== -1) {
          const end = idx + ann.text.length;
          const overlaps = ranges.some(r => !(end <= r.start || idx >= r.end));
          if (!overlaps) {
            ranges.push({ start: idx, end, ann });
          }
        }
      });

      ranges.sort((a, b) => a.start - b.start);

      let html = '';
      let cursor = 0;

      ranges.forEach(r => {
        if (r.start > cursor) {
          html += escapeHTML(paragraphText.slice(cursor, r.start));
        }
        const isFound = !!STATE.foundAnnotations[r.ann.id];
        const foundClass = isFound ? `found-${r.ann.category}` : '';
        html += `<span class="ann-token ${foundClass}" onclick="handleAnnotationClick('${r.ann.id}')" title="${isFound ? 'Clique para ver a explicação' : 'Clique para classificar este trecho'}">${escapeHTML(paragraphText.slice(r.start, r.end))}</span>`;
        cursor = r.end;
      });

      if (cursor < paragraphText.length) {
        html += escapeHTML(paragraphText.slice(cursor));
      }

      return html;
    }

    function renderStudyView() {
      const textObj = STATE.currentText;
      if (!textObj) return renderAcervoView();

      const isCurated = textObj.sourceType === 'curated';
      const auditNotes = textObj.auditReport?.notes || [];

      return `
        <section class="space-y-6">
          <!-- Cabeçalho do Estudo -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <button onclick="navigateTo('${isCurated ? 'acervo' : 'estudio'}')" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-ink transition self-start">
                ← Voltar para ${isCurated ? 'Acervo Curado' : 'Estúdio IA'}
              </button>
              <div class="flex items-center gap-2 flex-wrap">
                ${isCurated ? `
                  <span class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200">
                    ✓ 100% Revisado — Acervo Curado
                  </span>
                ` : `
                  <span class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-blue-800 border border-blue-200">
                    🛡️ Auditado pela Camada Normativa
                  </span>
                `}
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                  ${escapeHTML(textObj.genre)}
                </span>
              </div>
            </div>

            <div>
              <h2 class="text-2xl font-bold text-ink font-serif">${escapeHTML(textObj.title)}</h2>
              ${auditNotes.length > 0 ? `
                <details class="mt-3 rounded-xl bg-blue-50/60 border border-blue-200 px-4 py-2.5 text-xs text-blue-950">
                  <summary class="font-semibold cursor-pointer select-none">
                    Ver notas da Auditoria Normativa (${auditNotes.length})
                  </summary>
                  <ul class="list-disc pl-5 mt-2 space-y-1 text-blue-900">
                    ${auditNotes.map(n => `<li>${escapeHTML(n)}</li>`).join('')}
                  </ul>
                </details>
              ` : ''}
            </div>

            <!-- Sub-abas de Estudo -->
            <div class="flex items-center gap-2 border-t border-slate-100 pt-4 overflow-x-auto">
              <button onclick="setStudySubMode('leitura')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${STATE.studySubMode === 'leitura' ? 'bg-ink text-white shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                1. Leitura Ativa &amp; Marcação
              </button>
              <button onclick="setStudySubMode('questoes')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${STATE.studySubMode === 'questoes' ? 'bg-ink text-white shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                2. Bateria VUNESP (${textObj.questions.length} Questões)
              </button>
              <button onclick="setStudySubMode('reescrita')" class="px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${STATE.studySubMode === 'reescrita' ? 'bg-ink text-white shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                3. Laboratório de Reescrita (${textObj.rewrites.length})

          <!-- Conteúdo do Sub-modo -->

      `;
    }

    function renderSubModeLeitura(textObj) {
      const totalAnns = textObj.annotations.length;
      const foundCount = textObj.annotations.filter(a => STATE.foundAnnotations[a.id]).length;
      const fb = STATE.lastReadingFeedback;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
          <!-- Coluna Esquerda: Texto com Marcações -->
          <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-xs space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100">
              <div>
                <h3 class="text-base font-bold text-ink">Varredura Morfossintática Direcionada</h3>
                <p class="text-xs text-slate-500">Selecione uma categoria na barra ao lado e clique nos trechos sublinhados do texto.</p>
              </div>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 text-ink self-start sm:self-auto">
                ${foundCount} / ${totalAnns} identificados
              </span>
            </div>

            <!-- Parágrafos Numerados -->
            <div class="space-y-5 editorial-text text-base sm:text-[17px] text-slate-800">
              ${textObj.paragraphs.map((para, pIdx) => {
                const annsInPara = textObj.annotations.filter(a => a.paragraphIndex === pIdx);
                return `
                  <div class="flex gap-3 sm:gap-4 items-baseline">
                    <span class="text-xs font-sans font-bold text-slate-400 select-none shrink-0 w-6">§${pIdx + 1}</span>
                    <p class="flex-1">${buildInteractiveParagraphHTML(para, annsInPara)}</p>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Ações de Rodapé da Leitura -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-100">
              <div class="flex items-center gap-2">
                <button onclick="revealAllAnnotations()" class="px-3.5 py-2 rounded-lg border border-slate-300 text-xs font-semibold text-ink hover:bg-slate-50 transition">
                  Revelar Análise Completa
                </button>
                <button onclick="resetAnnotations()" class="px-3.5 py-2 rounded-lg text-xs font-medium text-slate-500 hover:bg-slate-100 transition">
                  Reiniciar Marcação
                </button>
              </div>
              <button onclick="setStudySubMode('questoes')" class="px-4 py-2 rounded-xl bg-ink text-white text-xs font-semibold hover:bg-slate-800 transition">
                Avançar para Questões A–E →
              </button>
            </div>
          </div>

          <!-- Coluna Direita: Pincéis de Categoria + Feedback Instantâneo -->
          <aside class="lg:col-span-4 space-y-4 lg:sticky lg:top-24">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
              <h4 class="text-sm font-bold text-ink">1. Escolha a Categoria</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">
                ${ANNOTATION_CATEGORIES.map(cat => {
                  const isSelected = STATE.selectedCategory === cat.id;
                  return `
                    <button
                      onclick="selectCategory('${cat.id}')"
                      class="w-full text-left px-3.5 py-2.5 rounded-xl border text-xs font-semibold flex items-center justify-between transition ${isSelected ? cat.colorClass + ' ring-2 ring-ink/30 shadow-xs' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}"
                    >
                      <span class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full ${cat.dot}"></span>
                        ${cat.label}
                      </span>
                      ${isSelected ? '<span class="text-[10px] uppercase tracking-wider">Ativo</span>' : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Card de Feedback -->
            <div class="rounded-2xl border p-5 shadow-xs transition ${
              !fb ? 'bg-white border-slate-200' :
              fb.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-950' :
              fb.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-950' :
              'bg-blue-50 border-blue-200 text-blue-950'
            }">
              <h4 class="text-xs font-bold uppercase tracking-wider mb-1.5 opacity-80">
                ${!fb ? 'Feedback Gramatical' : fb.type === 'success' ? '✓ Análise Validada' : fb.type === 'error' ? '✗ Tente Novamente' : 'ℹ️ Explicação'}
              </h4>
              <p class="text-sm font-bold leading-snug">
                ${fb ? escapeHTML(fb.title) : 'Clique em um trecho pontilhado no texto'}
              </p>
              <p class="text-xs mt-1.5 leading-relaxed opacity-90">
                ${fb ? escapeHTML(fb.message) : 'Ao identificar corretamente a classe morfológica ou função sintática, o trecho será destacado com a cor da categoria.'}
              </p>
            </div>
          </aside>
        </div>
      `;
    }

    function renderSubModeQuestoes(textObj) {
      const letters = ['A', 'B', 'C', 'D', 'E'];

      return `
        <div class="space-y-6">
          <!-- Texto recolhível para consulta rápida -->
          <details class="bg-white rounded-2xl border border-slate-200 shadow-xs">
            <summary class="px-6 py-4 text-sm font-bold text-ink cursor-pointer select-none flex items-center justify-between">
              <span>📖 Consultar o texto completo durante a resolução</span>
              <span class="text-xs font-normal text-slate-500">Clique para expandir</span>
            </summary>
            <div class="px-6 pb-6 pt-2 border-t border-slate-100 space-y-3 editorial-text text-sm sm:text-base text-slate-700">
              ${textObj.paragraphs.map((p, idx) => `<p><strong class="font-sans text-xs text-slate-400 mr-2">§${idx + 1}</strong>${escapeHTML(p)}</p>`).join('')}
            </div>
          </details>

          <!-- Lista das 6 Questões -->
          <div class="space-y-6">
            ${textObj.questions.map((q, qIdx) => {
              const userChoice = STATE.questionAnswers[q.id];
              const isAnswered = userChoice !== undefined;
              const isCorrect = isAnswered && userChoice === q.correctIndex;
              const pStyle = PILLAR_COLORS[q.pillar] || PILLAR_COLORS['Morfologia'];
              const contest = STATE.contestationResults[q.id];

              return `
                <article class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-7 shadow-xs space-y-5">
                  <!-- Cabeçalho da Questão -->
                  <div class="flex items-center justify-between gap-2 flex-wrap">
                    <div class="flex items-center gap-2.5">
                      <span class="w-7 h-7 rounded-lg bg-ink text-white text-xs font-bold flex items-center justify-center">
                        ${qIdx + 1}
                      </span>
                      <span class="text-xs font-semibold px-3 py-1 rounded-full border ${pStyle.bg} ${pStyle.text} ${pStyle.border}">
                        ${escapeHTML(q.pillar)}
                      </span>
                    </div>
                    ${isAnswered ? `
                      <span class="text-xs font-bold px-3 py-1 rounded-full ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                        ${isCorrect ? '✓ Resposta Correta' : `✗ Gabarito: ${letters[q.correctIndex]}`}
                      </span>
                    ` : ''}
                  </div>

                  <!-- Citação do Texto -->
                  <blockquote class="rounded-xl bg-paper border-l-4 border-ink px-4 py-3 text-sm sm:text-base font-serif italic text-slate-700">
                    ${escapeHTML(q.quote)}
                  </blockquote>

                  <!-- Enunciado -->
                  <p class="text-sm sm:text-base font-semibold text-ink leading-relaxed">
                    ${escapeHTML(q.stem)}
                  </p>

                  <!-- Alternativas A-E -->
                  <div class="space-y-2.5">
                    ${q.options.map((opt, optIdx) => {
                      let btnStyle = 'border-slate-200 bg-white hover:bg-slate-50 text-slate-800';
                      let badgeStyle = 'bg-slate-100 text-slate-700';

                      if (isAnswered) {
                        if (optIdx === q.correctIndex) {
                          btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-medium';
                          badgeStyle = 'bg-emerald-600 text-white';
                        } else if (optIdx === userChoice) {
                          btnStyle = 'border-rose-400 bg-rose-50 text-rose-950';
                          badgeStyle = 'bg-rose-600 text-white';
                        } else {
                          btnStyle = 'border-slate-100 bg-slate-50/50 text-slate-400';
                          badgeStyle = 'bg-slate-100 text-slate-400';
                        }
                      }

                      return `
                        <button
                          onclick="answerQuestion('${q.id}', ${optIdx})"
                          ${isAnswered ? 'disabled' : ''}
                          class="w-full text-left p-3.5 rounded-xl border flex items-start gap-3 transition ${btnStyle}"
                        >
                          <span class="w-6 h-6 rounded-md text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ${badgeStyle}">
                            ${letters[optIdx]}
                          </span>
                          <span class="text-sm leading-relaxed">${escapeHTML(opt)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  <!-- Gabarito Comentado (exibido após responder) -->
                  ${isAnswered ? `
                    <div class="rounded-xl bg-slate-50 border border-slate-200 p-4 sm:p-5 space-y-3">
                      <div class="space-y-1.5">
                        <p class="text-xs font-bold uppercase tracking-wider text-ink">Gabarito Comentado (${letters[q.correctIndex]})</p>
                        <p class="text-sm text-slate-700 leading-relaxed">${escapeHTML(q.explanation)}</p>
                        ${q.distractorsNote ? `
                          <p class="text-xs text-slate-600 leading-relaxed pt-1">
                            <strong>Por que as demais estão incorretas:</strong> ${escapeHTML(q.distractorsNote)}
                          </p>
                        ` : ''}
                      </div>

                      <!-- Barreira: Botão Contestar Gabarito -->
                      <div class="pt-3 border-t border-slate-200 flex flex-col gap-3">
                        <div class="flex items-center justify-between flex-wrap gap-2">
                          <span class="text-[11px] text-slate-500">Suspeita de ambiguidade ou caso facultativo?</span>
                          <button
                            onclick="handleContestQuestion('${q.id}')"
                            ${contest?.loading ? 'disabled' : ''}
                            class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold text-ink hover:bg-slate-100 disabled:opacity-50 transition"
                          >
                            ${contest?.loading ? 'Auditando com IA...' : '⚖️ Contestar / Revisar Gabarito com IA'}
                          </button>
                        </div>

                        ${contest?.text ? `
                          <div class="rounded-xl bg-blue-50 border border-blue-200 p-4 text-xs text-blue-950 whitespace-pre-line leading-relaxed">
                            <p class="font-bold mb-1">🛡️ Parecer Normativo Independente:</p>
                            ${escapeHTML(contest.text)}
                          </div>
                        ` : ''}
                        ${contest?.error ? `
                          <div class="rounded-xl bg-amber-50 border border-amber-200 p-3 text-xs text-amber-900">
                            ${escapeHTML(contest.error)}
                          </div>
                        ` : ''}
                      </div>
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </div>

          <div class="flex justify-end">
            <button onclick="setStudySubMode('reescrita')" class="px-5 py-2.5 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-slate-800 transition">
              Ir para o Laboratório de Reescrita →
            </button>
          </div>
        </div>
      `;
    }

    function renderSubModeReescrita(textObj) {
      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
            <h3 class="text-base font-bold text-ink">Laboratório de Reescrita (“Teste de Estresse” VUNESP)</h3>
            <p class="text-sm text-slate-600 mt-1">
              Pratique a habilidade mais cobrada pela banca: aplicar mutações sintáticas e verbais em períodos reais do texto, ajustando concordância, regência, crase e pontuação sem perder o sentido.
            </p>
          </div>

          ${textObj.rewrites.map((rw, idx) => {
            const val = STATE.rewriteInputs[rw.id] || '';
            const res = STATE.rewriteResults[rw.id];

            return `
              <article class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-7 shadow-xs space-y-5">
                <div class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-lg bg-ink text-white text-xs font-bold flex items-center justify-center">
                    ${idx + 1}
                  </span>
                  <h4 class="text-base font-bold text-ink">Desafio de Reescrita #${idx + 1}</h4>
                </div>

                <div class="space-y-2">
                  <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Período Original</p>
                  <blockquote class="rounded-xl bg-paper border-l-4 border-ink px-4 py-3 text-base font-serif text-slate-800">
                    “${escapeHTML(rw.original)}”
                  </blockquote>
                </div>

                <div class="rounded-xl bg-amber-50/70 border border-amber-200 p-4">
                  <p class="text-xs font-bold uppercase tracking-wider text-amber-900 mb-1">Comando de Mutação</p>
                  <p class="text-sm text-amber-950 font-medium leading-relaxed">${escapeHTML(rw.prompt)}</p>
                </div>

                <div class="space-y-2">
                  <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Sua Reescrita</label>
                  <textarea
                    rows="3"
                    oninput="updateRewriteInput('${rw.id}', this.value)"
                    placeholder="Digite aqui a frase reescrita com todos os ajustes gramaticais..."
                    class="w-full rounded-xl border border-slate-300 bg-paper p-3.5 text-sm font-serif text-ink focus:outline-none focus:ring-2 focus:ring-ink/20 focus:border-ink transition"
                  >${escapeHTML(val)}</textarea>
                </div>

                <div class="flex items-center justify-between gap-3 flex-wrap">
                  <span class="text-xs text-slate-500">Avaliação em 5 critérios: Concordância, Regência, Crase, Pontuação e Sentido.</span>
                  <button
                    onclick="handleEvaluateRewrite('${rw.id}')"
                    ${res?.loading ? 'disabled' : ''}
                    class="px-5 py-2.5 rounded-xl bg-ink text-white text-sm font-semibold hover:bg-slate-800 disabled:opacity-50 transition"
                  >
                    ${res?.loading ? 'Avaliando 5 Critérios...' : 'Avaliar Reescrita →'}
                  </button>
                </div>

                ${res && !res.loading && res.data ? `
                  <div class="rounded-xl border border-slate-200 bg-slate-50 p-5 space-y-4">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                      <span class="text-sm font-bold text-ink">
                        Resultado: ${escapeHTML(res.data.overallStatus)}
                        ${res.isFallback ? ' <span class="text-xs font-normal text-amber-700">(Modo Fallback Local)</span>' : ''}
                      </span>
                      ${res.data.score !== null && res.data.score !== undefined ? `
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-ink text-white">
                          Nota: ${res.data.score}/100
                        </span>
                      ` : ''}
                    </div>

                    <p class="text-sm text-slate-700 leading-relaxed">${escapeHTML(res.data.summary)}</p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                      ${(res.data.criteria || []).map(c => {
                        const badge = c.status === 'ok'
                          ? 'bg-emerald-100 text-emerald-800 border-emerald-200'
                          : c.status === 'erro'
                            ? 'bg-rose-100 text-rose-800 border-rose-200'
                            : 'bg-amber-100 text-amber-800 border-amber-200';
                        const icon = c.status === 'ok' ? '✓' : c.status === 'erro' ? '✗' : '!';
                        return `
                          <div class="rounded-lg bg-white border border-slate-200 p-3 space-y-1">
                            <div class="flex items-center justify-between">
                              <span class="text-xs font-bold text-ink">${escapeHTML(c.name)}</span>
                              <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${badge}">${icon}</span>
                            </div>
                            <p class="text-xs text-slate-600 leading-relaxed">${escapeHTML(c.comment)}</p>
                          </div>
                        `;
                      }).join('')}
                    </div>

                    <div class="rounded-lg bg-emerald-50 border border-emerald-200 p-3.5">
                      <p class="text-xs font-bold text-emerald-900 uppercase tracking-wider mb-1">Gabarito Modelo de Referência</p>
                      <p class="text-sm font-serif text-emerald-950">${escapeHTML(res.data.suggestedRewrite || rw.modelAnswer)}</p>
                    </div>
                  </div>
                ` : ''}
              </article>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 11. RENDERIZADOR PRINCIPAL E INICIALIZAÇÃO
    // =========================================================================

    function renderApp() {
      updateNavStyles();
      const root = document.getElementById('app-root');
      if (!root) return;

      switch (STATE.activeTab) {
        case 'acervo':
          root.innerHTML = renderAcervoView();
          break;
        case 'estudio':
          root.innerHTML = renderEstudioView();
          break;
        case 'diagnostico':
          root.innerHTML = renderDiagnosticoView();
          break;
        case 'barreiras':
          root.innerHTML = renderBarreirasView();
          break;
        case 'study':
          root.innerHTML = renderStudyView();
          break;
        default:
          root.innerHTML = renderAcervoView();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
